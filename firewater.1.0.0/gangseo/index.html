const CODE_TO_STATION = {};  // '81' → '강서소방서'
const CODE_TO_CENTER  = {};  // '81251' → '화곡119안전센터'
FIRE_STATIONS.forEach(s => {
  CODE_TO_STATION[s.code] = s.name;
  s.centers.forEach(c => { CODE_TO_CENTER[c.code] = c.name; });
});

// 소방서 드롭다운 동적 생성
const guSel = document.getElementById('gu-select');
FIRE_STATIONS.forEach(s => {
  const opt = document.createElement('option');
  opt.value = s.code; opt.textContent = s.name;
  guSel.appendChild(opt);
});

const MARKER_BLUE = 'https://t1.daumcdn.net/localimg/localimages/07/2018/pc/img/marker_spot.png';
const MARKER_RED  = 'image/지상식 소화전1.png';

// ── Firebase ─────────────────────────────────────────────
firebase.initializeApp({
  apiKey:            "AIzaSyBdoXaUJz27J1zJ6CFuk7_xBWJCRGo0B4M",
  authDomain:        "fire-water-map.firebaseapp.com",
  projectId:         "fire-water-map",
  storageBucket:     "fire-water-map.firebasestorage.app",
  messagingSenderId: "879331522326",
  appId:             "1:879331522326:web:823f9b62ac6065ad0a8237"
});
const auth = firebase.auth();
const db   = firebase.firestore();

// ── 전역 상태 ─────────────────────────────────────────────
let allData       = null;
let statuses      = {};
let currentUser   = null;
let pendingId     = null;
let openInfoWin   = null;
let mapInstance   = null;
let activeMarkers = [];
let activeOverlays= [];
let activeDataMap = new Map();
let myHydrantIds  = new Set();

auth.onAuthStateChanged(user => {
  currentUser = user;
  document.getElementById('logout-btn').style.display        = user ? 'block' : 'none';
  document.getElementById('my-hydrants-btn').style.display   = user ? 'block' : 'none';
  document.getElementById('my-list-open-btn').style.display  = user ? 'block' : 'none';

  else { myHydrantIds.clear(); }

// ── data.json 백그라운드 로드 ─────────────────────────────
function startDataLoad() {
  document.getElementById('loading').style.display = 'block';
  fetch('./data.json')
    .then(r => r.json())
    .then(rows => {
      allData = rows;
      document.getElementById('loading').style.display = 'none';
      showInitial();
    })
    .catch(e => {
      document.getElementById('loading').style.display = 'none';
      console.error('data.json 로드 실패:', e);
    });
}

// ── Firestore ─────────────────────────────────────────────
function loadStatusesFromFirestore() {
  db.collection('markerStatus').get()
    .then(snap => {
      snap.forEach(doc => { statuses[doc.id] = doc.data().status; });
      recolorActiveMarkers();
    })
    .catch(e => console.warn('Firestore 로드 실패:', e));
}

function saveStatusToFirestore(id, status) {
  db.collection('markerStatus').doc(String(id)).set({
    status, updatedBy: currentUser.email,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  }).catch(e => console.warn('Firestore 저장 실패:', e));
}

// ── 내 용수 ───────────────────────────────────────────────
function loadMyHydrantsFromFirestore() {
  db.collection('myHydrants')
    .where('userId', '==', currentUser.uid)
    .get()
    .then(snap => {
      myHydrantIds.clear();
      snap.forEach(doc => { const x = doc.data(); myHydrantIds.add(String(x.uid || x.hydrantId)); });
    })
    .catch(e => console.warn('내 용수 로드 실패:', e));
}

window.handleMyHydrant = function(key) {
  if (!currentUser) { pendingId = key; showLoginModal(); return; }
  const docId = currentUser.uid + '_' + key;
  if (myHydrantIds.has(String(key))) {
    db.collection('myHydrants').doc(docId).delete()
      .then(() => {
        myHydrantIds.delete(String(key));
        if (openInfoWin) { openInfoWin.close(); openInfoWin = null; }
      })
      .catch(e => alert('내 용수 해제 실패: ' + e.message));
  } else {
    const hydrant = allData ? allData.find(d => keyOf(d) === String(key)) : null;
    if (!hydrant) { alert('용수 데이터를 찾을 수 없습니다.'); return; }
    db.collection('myHydrants').doc(docId).set({
      userId: currentUser.uid,
      uid: String(key),                    // 전국 고유 식별자(소화용수ID)
      hydrantId: String(hydrant.id),       // 표시용 소화용수번호
      lat: hydrant.lat, lng: hydrant.lng,
      addr: hydrant.addr || '', type: hydrant.type || '', cd: hydrant.cd || '',
      registeredAt: firebase.firestore.FieldValue.serverTimestamp()
    }).then(() => {
      myHydrantIds.add(String(key));
      if (openInfoWin) { openInfoWin.close(); openInfoWin = null; }
    }).catch(e => alert('내 용수 등록 실패: ' + e.message));
  }
};

window.loadMyHydrantsOnMap = function() {
  if (!currentUser) { showLoginModal(); return; }
  db.collection('myHydrants')
    .where('userId', '==', currentUser.uid)
    .get()
    .then(snap => {
      const items = [];
      snap.forEach(doc => {
        const d = doc.data();
        items.push({ id: d.hydrantId, uid: d.uid || d.hydrantId, lat: d.lat, lng: d.lng, addr: d.addr, type: d.type, cd: d.cd || '' });
      });
      if (items.length === 0) { alert('등록된 내 용수가 없습니다.'); return; }
      showResults(items);
    })
    .catch(e => alert('내 용수 불러오기 실패: ' + e.message));
};

// ── 내 용수 목록 모달 ─────────────────────────────────────
window.openMyHydrantsList = function() {
  if (!currentUser) { showLoginModal(); return; }
  document.getElementById('my-list-modal').style.display = 'flex';
  renderMyList();
};

function renderMyList() {
  const content = document.getElementById('my-list-content');
  content.innerHTML = '<div style="text-align:center;padding:24px;color:#aaa;">로딩 중...</div>';
  db.collection('myHydrants')
    .where('userId', '==', currentUser.uid)
    .get()
    .then(snap => {
      if (snap.empty) {
        content.innerHTML = '<div style="text-align:center;padding:24px;color:#aaa;">등록된 내 용수가 없습니다.</div>';
        return;
      }
      const rows = [];
      snap.forEach(doc => { rows.push(doc.data()); });
      content.innerHTML = rows.map(d => {
        const station = CODE_TO_STATION[(d.cd||'').slice(0,2)] || '';
        const center  = CODE_TO_CENTER[d.cd] || '';
        return `
          <div class="my-item">
            <div class="my-item-info">
              <div class="num">No. ${d.hydrantId}</div>
              <div class="sub">${station}${center ? ' &gt; ' + center : ''}</div>
              <div class="sub">${d.type || '-'} | ${d.addr || '-'}</div>
            </div>
            <button class="my-item-del" onclick="deleteMyHydrant('${d.uid || d.hydrantId}','${d.hydrantId}')">삭제</button>
          </div>`;
      }).join('');
    })
    .catch(e => {
      content.innerHTML = '<div style="text-align:center;padding:16px;color:#e74c3c;">로드 실패</div>';
    });
}

window.deleteMyHydrant = function(key, label) {
  if (!currentUser) return;
  if (!confirm('No.' + (label || key) + ' 을(를) 내 용수에서 삭제하시겠습니까?')) return;
  const docId = currentUser.uid + '_' + key;
  db.collection('myHydrants').doc(docId).delete()
    .then(() => {
      myHydrantIds.delete(String(key));
      renderMyList();
    })
    .catch(e => alert('삭제 실패: ' + e.message));
};

function makeImg(src) {
  return new kakao.maps.MarkerImage(src, new kakao.maps.Size(36, 36));
}

// 식별 키: 전국 고유한 uid(소화용수ID) 우선, 없으면 id(구버전 데이터 호환)
function keyOf(d) { return String(d.uid || d.id); }

function recolorActiveMarkers() {
  activeDataMap.forEach((d, idx) => {
    activeMarkers[idx]?.setImage(makeImg(statuses[keyOf(d)] === 'done' ? MARKER_RED : MARKER_BLUE));
  });
}

// ── 마커 생성 (결과에 한해서만) ───────────────────────────
function clearMarkers() {
  activeMarkers.forEach(m => m.setMap(null));
  activeOverlays.forEach(o => o.setMap(null));
  activeMarkers = []; activeOverlays = [];
  activeDataMap.clear();
  if (openInfoWin) { openInfoWin.close(); openInfoWin = null; }
}

function showResults(items) {
  clearMarkers();
  const countEl = document.getElementById('result-count');
  if (items.length === 0) {
    countEl.textContent = '결과 없음'; countEl.style.display = 'block'; return;
  }

  items.forEach((d, idx) => {
    const pos  = new kakao.maps.LatLng(d.lat, d.lng);
    const key  = keyOf(d);
    const done = statuses[key] === 'done';
    const stationName = CODE_TO_STATION[d.cd.slice(0,2)] || '';
    const centerName  = CODE_TO_CENTER[d.cd] || '';

    const marker = new kakao.maps.Marker({
      position: pos,
      image: makeImg(done ? MARKER_RED : MARKER_BLUE)
    });
    marker.setMap(mapInstance);
    activeMarkers.push(marker);
    activeDataMap.set(idx, d);

    const overlay = new kakao.maps.CustomOverlay({
      content: `<div style="font-size:11px;color:#fff;background:rgba(0,0,0,.7);padding:1px 4px;border-radius:3px;white-space:nowrap;">${d.id}</div>`,
      position: pos, yAnchor: 2.8
    });
    overlay.setMap(mapInstance);
    activeOverlays.push(overlay);

    kakao.maps.event.addListener(marker, 'click', () => {
      if (openInfoWin) openInfoWin.close();
      const isDone = statuses[key] === 'done';
      const isMine = myHydrantIds.has(key);
      const myBtn  = currentUser ? `
        <button onclick="handleMyHydrant('${key}')" style="
          margin-top:4px;width:100%;padding:9px;
          background:${isMine ? '#e67e22' : '#3498db'};
          color:#fff;border:none;border-radius:6px;
          cursor:pointer;font-size:13px;font-weight:bold;">
          ${isMine ? '★ 내 용수 해제' : '☆ 내 용수 등록'}
        </button>` : '';
      const iw = new kakao.maps.InfoWindow({
        content: `
          <div style="padding:14px;min-width:200px;font-size:14px;line-height:1.9;">
            <b>용수번호:</b> ${d.id}<br>
            <b>소방서:</b> ${stationName}<br>
            <b>센터:</b> ${centerName}<br>
            <b>주소:</b> ${d.addr || '-'}<br>
            <b>종류:</b> ${d.type || '-'}<br>
            <button onclick="handleToggle('${key}')" style="
              margin-top:8px;width:100%;padding:9px;
              background:${isDone ? '#e74c3c' : '#2ab56f'};
              color:#fff;border:none;border-radius:6px;
              cursor:pointer;font-size:13px;font-weight:bold;">
              ${isDone ? '✕ 용수확인 취소' : '✓ 용수확인 완료'}
            </button>
            ${myBtn}
          </div>`
      });
      iw.open(mapInstance, marker);
      openInfoWin = iw;
    });
  });

  countEl.textContent = `${items.length}개`;
  countEl.style.display = 'block';
  mapInstance.panTo(new kakao.maps.LatLng(items[0].lat, items[0].lng));
}

function showInitial() {
  if (!allData || !mapInstance) return;
  showResults(allData.slice(0, 10));
}

// ── 용수확인 토글 ─────────────────────────────────────────
window.handleToggle = function(id) {
  if (!currentUser) { pendingId = id; showLoginModal(); }
  else toggleStatus(id);
};

function toggleStatus(id) {
  statuses[id] = statuses[id] !== 'done' ? 'done' : 'default';
  recolorActiveMarkers();
  if (openInfoWin) { openInfoWin.close(); openInfoWin = null; }
  saveStatusToFirestore(id, statuses[id]);
}

// ── 로그인/회원가입 모달 ──────────────────────────────────
let authMode = 'login'; // 'login' | 'signup'

window.switchTab = function(mode) {
  authMode = mode;
  document.getElementById('tab-login').classList.toggle('active', mode === 'login');
  document.getElementById('tab-signup').classList.toggle('active', mode === 'signup');
  document.getElementById('signup-pw2').style.display    = mode === 'signup' ? 'block' : 'none';
  document.getElementById('signup-notice').style.display = mode === 'signup' ? 'block' : 'none';
  document.getElementById('login-submit').textContent    = mode === 'login' ? '로그인' : '회원가입';
  // 로그인 탭에는 체험용 계정을 회색 안내글로 보여 준다
  document.getElementById('login-email').placeholder = mode === 'login' ? '1@seoul.go.kr' : '이메일 주소 (@seoul.go.kr)';
  document.getElementById('login-pw').placeholder    = mode === 'login' ? '123456' : '비밀번호 (6자 이상)';
  document.getElementById('login-error').style.display   = 'none';
  document.getElementById('login-success').style.display = 'none';
};

function showLoginModal() {
  authMode = 'login';
  switchTab('login');
  document.getElementById('login-email').value  = '';
  document.getElementById('login-pw').value     = '';
  document.getElementById('signup-pw2').value   = '';
  document.getElementById('login-modal').style.display = 'flex';
}

function showMsg(type, text) {
  const errEl = document.getElementById('login-error');
  const okEl  = document.getElementById('login-success');
  errEl.style.display = 'none'; okEl.style.display = 'none';
  if (type === 'error') { errEl.textContent = text; errEl.style.display = 'block'; }
  else                  { okEl.textContent  = text; okEl.style.display  = 'block'; }
}

document.getElementById('login-submit').addEventListener('click', async () => {
  const email = document.getElementById('login-email').value.trim();
  const pw    = document.getElementById('login-pw').value;
  const pw2   = document.getElementById('signup-pw2').value;

  if (!email || !pw) { showMsg('error', '이메일과 비밀번호를 입력해 주세요.'); return; }

  if (authMode === 'signup') {
    if (!email.endsWith('@seoul.go.kr')) {
      showMsg('error', '서울시 공무원 이메일(@seoul.go.kr)만 가입 가능합니다.');
      return;
    }
    if (pw !== pw2) { showMsg('error', '비밀번호가 일치하지 않습니다.'); return; }
    if (pw.length < 6) { showMsg('error', '비밀번호는 6자 이상이어야 합니다.'); return; }

    // [샘플 버전] 실제 이메일 발송 대신 인증번호를 알림창으로 표시
    const verifyCode = String(Math.floor(100000 + Math.random() * 900000));
    alert('[샘플] 이메일 인증번호\n\n' + verifyCode +
          '\n\n실제 서비스에서는 이 번호가 ' + email + ' 메일로 발송됩니다.');
    const entered = prompt('인증번호 6자리를 입력해 주세요.');
    if (entered === null) { showMsg('error', '이메일 인증이 취소되었습니다.'); return; }
    if (entered.trim() !== verifyCode) {
      showMsg('error', '인증번호가 일치하지 않습니다. 다시 시도해 주세요.'); return;
    }

    try {
      await auth.createUserWithEmailAndPassword(email, pw);
      document.getElementById('login-modal').style.display = 'none';
      if (pendingId !== null) { toggleStatus(pendingId); pendingId = null; }
    } catch (e) {
      const msg = e.code === 'auth/email-already-in-use' ? '이미 사용 중인 이메일입니다.'
                : e.code === 'auth/invalid-email'        ? '이메일 형식이 올바르지 않습니다.'
                : '회원가입 실패: ' + e.message;
      showMsg('error', msg);
    }
  } else {
    try {
      const cred = await auth.signInWithEmailAndPassword(email, pw);
      const u = cred.user;
      if (!u.email || !u.email.endsWith('@seoul.go.kr')) {
        await auth.signOut();
        showMsg('error', '서울시 공무원 이메일(@seoul.go.kr)만 로그인할 수 있습니다.');
        return;
      }
      document.getElementById('login-modal').style.display = 'none';
      if (pendingId !== null) { toggleStatus(pendingId); pendingId = null; }
    } catch (e) {
      const msg = e.code === 'auth/user-not-found'  ? '등록되지 않은 이메일입니다.'
                : e.code === 'auth/wrong-password'  ? '비밀번호가 올바르지 않습니다.'
                : e.code === 'auth/invalid-email'   ? '이메일 형식이 올바르지 않습니다.'
                : '로그인 실패: ' + e.message;
      showMsg('error', msg);
    }
  }
});

document.getElementById('login-cancel').addEventListener('click', () => {
  document.getElementById('login-modal').style.display = 'none';
  pendingId = null;
});

document.getElementById('logout-btn').addEventListener('click', () => auth.signOut());

// ── 카카오맵 초기화 ───────────────────────────────────────
kakao.maps.load(() => {
  mapInstance = new kakao.maps.Map(document.getElementById('map'), {
    center: new kakao.maps.LatLng(37.5502, 126.9786),
    level: 8
  });

  kakao.maps.event.addListener(mapInstance, 'click', () => {
    if (openInfoWin) { openInfoWin.close(); openInfoWin = null; }
  });

  startDataLoad();

  const centerSel = document.getElementById('center-select');

  // 소방서 선택 → 센터 드롭다운 갱신 + 지도 이동
  guSel.addEventListener('change', () => {
    const station = FIRE_STATIONS.find(s => s.code === guSel.value);
    centerSel.innerHTML = '<option value="">-- 센터 선택 --</option>';
    if (station) {
      station.centers.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c.code; opt.textContent = c.name;
        centerSel.appendChild(opt);
      });
      mapInstance.setCenter(new kakao.maps.LatLng(station.lat, station.lng));
      mapInstance.setLevel(6);
    }
    runSearch();
  });

  centerSel.addEventListener('change', runSearch);

  document.getElementById('searchBtn').addEventListener('click', runSearch);
  document.getElementById('search').addEventListener('keydown', e => {
    if (e.key === 'Enter') runSearch();
  });

  let locationOverlay = null;

  document.getElementById('location-btn').addEventListener('click', () => {
    if (!navigator.geolocation) { alert('위치 정보를 사용할 수 없습니다.'); return; }
    navigator.geolocation.getCurrentPosition(p => {
      const pos = new kakao.maps.LatLng(p.coords.latitude, p.coords.longitude);

      if (locationOverlay) locationOverlay.setMap(null);
      locationOverlay = new kakao.maps.CustomOverlay({
        position: pos,
        content: `<div style="
          width:22px;height:22px;
          background:#3b82f6;
          border:3px solid white;
          border-radius:50%;
          box-shadow:0 2px 8px rgba(0,0,0,.5);
          cursor:default;
        "></div>`,
        zIndex: 999,
        yAnchor: 0.5,
        xAnchor: 0.5
      });
      locationOverlay.setMap(mapInstance);
      mapInstance.setCenter(pos);
    }, () => alert('현재 위치를 가져올 수 없습니다.'));
  });

  function runSearch() {
    if (!allData) { alert('데이터 로딩 중입니다. 잠시 후 다시 시도해 주세요.'); return; }

    const stationCode = guSel.value;       // e.g. '81'
    const centerCode  = centerSel.value;   // e.g. '81251'
    const query       = document.getElementById('search').value.trim();

    let results = allData;

    // CD 코드로 정확한 필터링
    if (centerCode) {
      results = results.filter(d => d.cd === centerCode);
    } else if (stationCode) {
      results = results.filter(d => d.cd.startsWith(stationCode));
    }

    // 번호·주소 텍스트 검색
    if (query) {
      results = results.filter(d =>
        String(d.id).startsWith(query) || (d.addr || '').includes(query)
      );
    }

    showResults(results.slice(0, 300));
  }
});
</script>

    when: '점검할 때',

    body: '지도에서 마커를 누르면 그 용수의 [용수확인]을 누를 수 있고,\n확인한 곳은 빨간 마커로 바뀝니다.\n종이 지도에 동그라미 치던 일제조사를 그대로 지도 위에서 합니다.'
  },
  {
    sel: '#location-btn',
    when: '현장에서',
    title: '지금 서 있는 자리 주변으로 지도를 옮깁니다.',
    body: '주소를 몰라도 가까운 용수를 바로 찾을 수 있습니다.'
  },
  {
    sel: null,
    when: '처음 한 번',
    title: '★ 로그인 단추는 따로 없습니다.',
    body: '[용수확인]이나 [내 용수]를 처음 누를 때 로그인 창이 저절로 뜹니다.\n가입은 서울시 공무원 메일(@seoul.go.kr)만 됩니다.\n로그인하면 아래에 [내 용수] 단추가 새로 생깁니다.'
  }
];
</script>
<!-- ══════════════════════════════════════════════════════════════════
     가이드 투어 — 처음 쓰는 사람이 밟을 자리를 차례로 짚는다.
     ★ 보여 주기만 한다. 값은 하나도 안 고친다 — 자리를 밝히고 설명을
       띄우는 것이 전부다. 닫으면 보던 자리로 돌려놓는다.
     ★ 짚는 자리는 「이미 화면에 글로 적혀 있는 것」을 뺀 것들이다.
       안내문에 있는 말을 되풀이하면 읽지 않게 된다.
     ★ 앱마다 CSS 가 제각각이라 이름은 전부 tour- 로 시작하고,
       아래 「담 쌓기」로 앱의 button/p/h3 규칙이 새어 들어오지 못하게 막는다.
       (실제로 button.primary{width:100%} 같은 규칙에 말풍선이 망가졌었다)
     ══════════════════════════════════════════════════════════════════ -->
<style>
/* ── 담 쌓기: 앱 CSS 가 투어 안으로 새어 들어오지 못하게 ────────── */
#tour, #tour *, #tourBtn{
  box-sizing:border-box; float:none; text-transform:none; letter-spacing:normal;
  text-align:left; text-indent:0; text-shadow:none;
}
/* ★ 초기화는 말풍선 「안쪽」에만 건다. #tour div 같은 선택자는 #tourBox 보다
   특정도가 높아서 링과 말풍선의 position:fixed 까지 덮어써 자리를 통째로
   망가뜨린다(실제로 한 번 밟았다). 여기 있는 것들은 전부 특정도 (1,0,0) 이라
   뒤에 오는 #tourNum·#tourTitle 같은 규칙이 동점으로 이긴다. */
#tourBox > *, #tourBox > * > *{
  margin:0; padding:0; width:auto; height:auto; min-width:0; max-width:none;
  min-height:0; position:static; transform:none; flex:0 0 auto; border:0;
  background:none; box-shadow:none; opacity:1; visibility:visible; float:none;
}

/* ── 투어 본체 ──────────────────────────────────────────────────── */
#tour[hidden]{display:none}
#tour{position:fixed; inset:0; z-index:2147483000}
/* 짚는 자리 — 테두리만 두르고, 바깥은 거대한 box-shadow 로 한꺼번에 어둡게 만든다.
   (네 조각으로 가리는 것보다 간단하고, 자리가 옮겨질 때 어긋나지 않는다) */
#tourRing{
  position:fixed; border-radius:6px; pointer-events:none;
  outline:3px solid #1d8a4e; box-shadow:0 0 0 9999px rgba(16,24,32,.6);
}
#tourBox{
  position:fixed; width:330px; max-width:calc(100vw - 24px);
  background:#fff; color:#1f2937; border-radius:10px; padding:13px 15px 11px;
  box-shadow:0 10px 30px rgba(0,0,0,.3);
  font-family:'Pretendard',-apple-system,BlinkMacSystemFont,system-ui,'Malgun Gothic',sans-serif;
  line-height:normal;
}
#tourBox .tour-step{display:flex; align-items:center; gap:7px; font-size:11.5px; margin-bottom:5px}
#tourNum{color:#1d8a4e; font-weight:700; font-size:11.5px}
#tourWhen{color:#6b7280; border:1px solid #e5e7eb; border-radius:9px; padding:1px 7px; font-size:11.5px}
#tourTitle{font-size:13.5px; font-weight:700; margin-bottom:5px; letter-spacing:-.2px; color:#111827; line-height:1.45}
#tourBody{font-size:12.5px; line-height:1.62; color:#374151; white-space:pre-line}
#tourBox .tour-bar{display:flex; align-items:center; gap:6px; margin-top:11px}
#tourBox .tour-sp{flex:1 1 auto}
#tourBox button{
  font-family:inherit; font-size:12px; font-weight:600; white-space:nowrap;
  padding:5px 11px; border-radius:7px; cursor:pointer;
  border:1px solid #d1d5db; background:#fff; color:#374151;
}
#tourBox button:hover{background:#f9fafb}
#tourBox button[disabled]{opacity:.4; cursor:not-allowed}
#tourBox button.tour-ghost{border-color:transparent; color:#9ca3af; font-weight:500}
#tourBox button.tour-ghost:hover{background:#f3f4f6}
#tourBox button.tour-primary{background:#1d8a4e; border-color:#1d8a4e; color:#fff}
#tourBox button.tour-primary:hover{background:#177040}
/* 이 단추는 눌러도 아무것도 저장되지 않는다 — 속이 빈 테두리형으로 구분한다 */
#tourBtn{
  position:fixed; right:16px; bottom:16px; z-index:2147482000;
  font-family:'Pretendard',-apple-system,BlinkMacSystemFont,system-ui,'Malgun Gothic',sans-serif;
  font-size:13px; font-weight:700; white-space:nowrap; padding:9px 15px; margin:0;
  border-radius:999px; cursor:pointer; width:auto; height:auto; opacity:1;
  border:1px solid #1d8a4e; background:rgba(255,255,255,.96); color:#1d8a4e;
  box-shadow:0 4px 14px rgba(0,0,0,.18);
}
#tourBtn:hover{background:#eaf6ef; opacity:1}
/* 투어는 화면에서만 쓰는 것이다 — 인쇄에는 흔적도 남지 않는다 */
@media print{ #tour, #tourBtn{display:none !important} }
</style>

<button id="tourBtn" type="button" title="처음 쓰시는 분은 여기부터 — 화면을 짚어 가며 알려 드립니다">사용법 안내</button>
<div id="tour" hidden role="dialog" aria-modal="true" aria-label="사용법 안내">
  <div id="tourRing"></div>
  <div id="tourBox">
    <div class="tour-step"><span id="tourNum"></span><span id="tourWhen"></span></div>
    <div id="tourTitle"></div>
    <div id="tourBody"></div>
    <div class="tour-bar">
      <button type="button" class="tour-ghost" id="tourQuit">그만 보기</button>
      <span class="tour-sp"></span>
      <button type="button" id="tourPrev">이전</button>
      <button type="button" class="tour-primary" id="tourNext">다음</button>
    </div>
  </div>
</div>
<script>
(function () {
  "use strict";
  var $ = function (s) { return document.querySelector(s); };
  var TOUR = window.TOUR_STEPS || [];
  if (!TOUR.length) { var b0 = $("#tourBtn"); if (b0) b0.style.display = "none"; return; }

  var at = -1, homeScroll = 0, raf = 0;

  /* ★ zoom 을 쓰는 앱이 있다 — 소방차 적재는 사용자가 화면 배율을 조절하고
     app.js 가 html 의 zoom 을 런타임에 바꾼다.
     getBoundingClientRect·innerWidth 는 화면 좌표인데 style 에 쓰는 px 에는
     zoom 이 곱해져, 그대로 두면 링과 말풍선이 배율만큼 밀린다.
     투어에 역배율을 걸어 안쪽을 화면 좌표와 1:1 로 맞춘다 — 그러면 아래 계산은
     zoom 을 몰라도 된다. 배율이 도중에 바뀌므로 place() 마다 확인한다. */
  var lastZoom = 0;
  function syncZoom() {
    var z = 1, el = $("#tour").parentElement;
    while (el) { z *= parseFloat(getComputedStyle(el).zoom) || 1; el = el.parentElement; }
    if (!z) z = 1;
    if (z === lastZoom) return;
    lastZoom = z;
    var inv = z === 1 ? "" : String(1 / z);
    $("#tour").style.zoom = inv;
    $("#tourBtn").style.zoom = inv;
  }
  syncZoom();

  /* 단추 자리 — 앱마다 비어 있는 모서리가 다르다.
     steps 파일에서 window.TOUR_BTN_POS = "bottom-left" 처럼 정해 준다.
     (실제로 소방펌프차는 오른쪽 아래에 [강의보러가기]가 이미 앉아 있었다) */
  (function () {
    var b = $("#tourBtn"), pos = window.TOUR_BTN_POS || "bottom-right";
    b.style.top = b.style.bottom = b.style.left = b.style.right = "auto";
    if (pos.indexOf("top") === 0) b.style.top = "16px"; else b.style.bottom = "16px";
    if (pos.indexOf("left") >= 0) b.style.left = "16px"; else b.style.right = "16px";
  })();

  /* 아직 안 열린 화면(시험 시작 전의 문항 목록 같은 것)은 문서에는 있어도
     크기가 0 이다. 그런 것을 짚으면 링이 화면 구석에 조각으로 남는다 —
     아예 없는 것으로 보고 설명만 가운데에 띄운다. */
  function findTarget(s) {
    if (!s || !s.sel) return null;
    var el = document.querySelector(s.sel);
    if (!el) return null;
    var r = el.getBoundingClientRect();
    return (r.width || r.height) ? el : null;
  }

  /* 짚은 자리에 테두리를 두르고 그 옆에 말풍선을 놓는다.
     ★ 화면보다 큰 것은 위쪽만 짚는다 — 링이 화면을 넘으면
       어디가 짚인 곳인지 되레 안 보인다. */
  function place() {
    var s = TOUR[at]; if (!s) return;
    syncZoom();
    var ring = $("#tourRing"), box = $("#tourBox");
    var el = findTarget(s);
    var bh = box.offsetHeight, bw = box.offsetWidth;
    var vh = window.innerHeight, vw = window.innerWidth;
    if (!el) {                       // 못 찾으면 설명만 가운데에 (화면이 바뀌어도 안 멈추게)
      ring.style.display = "none";
      box.style.left = Math.max(8, (vw - bw) / 2) + "px";
      box.style.top = "96px";
      return;
    }
    ring.style.display = "";
    var r = el.getBoundingClientRect(), pad = 6, gap = 12;
    var top = Math.max(8, r.top - pad);
    var h = Math.max(20, Math.min(r.height + pad * 2, vh - top - 8));
    var left = Math.max(4, r.left - pad);
    var width = Math.min(r.width + pad * 2, vw - 8);
    ring.style.top = top + "px"; ring.style.height = h + "px";
    ring.style.left = left + "px"; ring.style.width = width + "px";

    /* 말풍선은 짚어 놓은 자리를 절대 가리면 안 된다 — 가리면 밝혀 놓은 뜻이 없다.
       아래 → 위 → 오른쪽 → 왼쪽 순으로 빈 곳을 찾고, 어디에도 안 들어가면
       그때만 화면 안으로 밀어 넣는다. */
    var cT = function (v) { return Math.max(8, Math.min(v, vh - bh - 8)); };
    var cL = function (v) { return Math.max(8, Math.min(v, vw - bw - 8)); };
    if (top + h + gap + bh <= vh - 8)           { box.style.top = (top + h + gap) + "px"; box.style.left = cL(r.left) + "px"; }
    else if (top - gap - bh >= 8)               { box.style.top = (top - gap - bh) + "px"; box.style.left = cL(r.left) + "px"; }
    else if (left + width + gap + bw <= vw - 8) { box.style.top = cT(top) + "px"; box.style.left = (left + width + gap) + "px"; }
    else if (left - gap - bw >= 8)              { box.style.top = cT(top) + "px"; box.style.left = (left - gap - bw) + "px"; }
    else                                        { box.style.top = cT(top + h + gap) + "px"; box.style.left = cL(r.left) + "px"; }
  }

  function show(i) {
    at = Math.max(0, Math.min(TOUR.length - 1, i));
    var s = TOUR[at];
    /* 화면을 넘겨 주는 것은 투어가 한다(따라가기만 하면 되게).
       before 는 탭을 열거나 접힌 것을 펼치는 등 「보여 주기」만 한다. */
    if (typeof s.before === "function") { try { s.before(); } catch (e) {} }
    $("#tourNum").textContent = (at + 1) + " / " + TOUR.length;
    $("#tourWhen").textContent = s.when || "";
    $("#tourWhen").style.display = s.when ? "" : "none";
    $("#tourTitle").textContent = s.title || "";
    $("#tourBody").textContent = s.body || "";
    $("#tourBody").style.display = s.body ? "" : "none";
    $("#tourPrev").disabled = at === 0;
    $("#tourNext").textContent = at === TOUR.length - 1 ? "마침" : "다음";
    $("#tour").hidden = false;
    var el = findTarget(s);
    // 이 앱에 scroll-behavior:smooth 가 걸려 있어도 투어만은 즉시 옮긴다
    if (el) { try { el.scrollIntoView({ block: "center", behavior: "instant" }); } catch (e) { el.scrollIntoView(); } }
    place();
  }

  /* 자리를 매 프레임 다시 잰다 — 스크롤·펼침 애니메이션·창 크기 변화를
     따로 듣지 않아도 링이 절대 어긋나지 않는다. */
  function loop() { if (at >= 0) { place(); raf = requestAnimationFrame(loop); } }

  function start() { homeScroll = window.pageYOffset; show(0); cancelAnimationFrame(raf); loop(); }
  function end() {
    $("#tour").hidden = true; at = -1; cancelAnimationFrame(raf);
    // 투어가 펼쳐 놓은 것이 있으면 앱이 도로 접는다
    if (typeof window.TOUR_ON_END === "function") { try { window.TOUR_ON_END(); } catch (e) {} }
    // 보던 자리로 돌려놓는다 — 투어가 화면을 옮겨 놓고 가면 안 된다
    window.scrollTo(0, homeScroll);
  }

  $("#tourBtn").onclick = start;
  $("#tourQuit").onclick = end;
  $("#tourPrev").onclick = function () { if (at > 0) show(at - 1); };
  $("#tourNext").onclick = function () { if (at === TOUR.length - 1) end(); else show(at + 1); };
  /* 키보드 — Esc 로 닫고 ← → 로 옮긴다 */
  document.addEventListener("keydown", function (e) {
    if ($("#tour").hidden) return;
    if (e.key === "Escape") end();
    else if (e.key === "ArrowRight" && at < TOUR.length - 1) show(at + 1);
    else if (e.key === "ArrowLeft" && at > 0) show(at - 1);
  });
})();
</script>
<!-- ===== 가이드 투어 끝 ===== -->
</body>
</html>
